name: vietnam_map_01
description: "VietNam Map Checkin Flutter app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  go_router: ^14.6.2
  http: ^1.2.2
  intl: ^0.20.2
  path: ^1.9.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vn.svg
    - assets/vietnam-provinces.geojson
    - assets/seeds/checkins_seed.json
